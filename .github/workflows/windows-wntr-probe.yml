name: Windows WNTR encrypted bundle probe
on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-friction-20261103
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Download encrypted release bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'epanet22.zip'
          $root = Join-Path $env:RUNNER_TEMP 'epanet22'
          gh release download v2.8.1-preview.5 --repo ericwanderlust/epanet-turbo --pattern '*windows-x64-candidate.zip' --output $zip
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          Expand-Archive -Path $zip -DestinationPath $root
          $tag = 'cp' + ('${{ matrix.python-version }}' -replace '\.', '')
          "TURBO_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$root\python\$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install bundle requirements
        shell: pwsh
        run: python -m pip install -r "$env:TURBO_ROOT\requirements.txt"
      - name: Check encrypted reader against WNTR cases
        shell: pwsh
        env:
          EPANET_TURBO_UPSTREAM_NETS: ${{ github.workspace }}/examples
          EPANET_TURBO_TEST_DIR: ${{ runner.temp }}
          EPANET_TURBO_TEST_REPORT: ${{ github.workspace }}/reader-contract.json
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: python examples/verify_fast_reader.py
      - name: Run full WNTR comparisons
        shell: pwsh
        run: python examples/windows_wntr_probe.py --bundle "$env:TURBO_ROOT" --inp examples/Net2.inp --output windows-wntr-probe.json
      - name: Verify low-flow friction and hydraulic-file compatibility
        shell: pwsh
        run: python examples/verify_friction_precision.py --bundle "$env:TURBO_ROOT" --inp examples/Net2.inp --output friction-contract.json
      - name: Run the encrypted benchmark
        shell: pwsh
        run: |
          $tag = 'cp' + ('${{ matrix.python-version }}' -replace '\.', '')
          python "$env:TURBO_ROOT\python\$tag\benchmark_wntr.py" --inp examples/Net2.inp --library "$env:TURBO_ROOT\native\windows_x86_64\epanet2.dll" --runs 1 --output encrypted-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wntr-${{ matrix.python-version }}
          path: |
            reader-contract.json
            windows-wntr-probe.json
            friction-contract.json
            encrypted-benchmark.json
          if-no-files-found: warn
